[project]
name = "pdf-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pypdf>=6.16.1",
    "pytest>=9.1.1",
    "reportlab>=5.0.0",
]

[tool.setuptools]
py-modules = ["pdfmerge", "pdfpageno"]

[project.scripts]
pdfmerge = "pdfmerge:main"
pdfno = "pdfno:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
